[project]
name = "claude-usage-widget"
version = "2.0.0"
description = "Cross-platform System Tray Widget for Claude Code & Google Antigravity usage monitoring"
readme = "README.md"
authors = [
    { name = "giuspo" }
]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "desktop-notifier>=6.2.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pillow>=13.0.0",
    "pyqt6>=6.11.0",
    "qasync>=0.28.0",
    "watchfiles>=1.3.0",
]

[project.scripts]
claude-usage = "claude_usage.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_usage"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
